name: Update stats

on:
  schedule:
    # Every day at 09:00 UTC (03:00 in Mexico City).
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild SVG
        # The script uses the standard library only: nothing to install.
        # If the GitHub API fails it exits with code 1 and the job goes red
        # without touching the files, so no profile full of zeros ships.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate.py --stats

      - name: Publish if anything changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "No changes in assets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: update profile stats"
          git push
